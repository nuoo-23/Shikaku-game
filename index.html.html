function rewardForLevel(level) {
  let chosen = VISUAL_REWARDS[0];
  VISUAL_REWARDS.forEach(r => { if (r.unlock <= level) chosen = r; });
  return chosen;
}

const CSS = `

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function randomOf(seed) { let s = hash(seed) || 1; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
function levelConfig(level) {
  const size = level < 3 ? 5 : level < 6 ? 6 : level < 10 ? 7 : level < 15 ? 8 : level < 21 ? 9 : level < 31 ? 10 : 11;
  const density = level < 10 ? .7 : level < 20 ? .82 : level < 35 ? .92 : .98;
  const target = Math.min(size * size - 1, Math.max(8, Math.floor(7 + level * 1.25)));
  return { size, target, density };
}
function makeRegions(seed, size, target) {
  const r = randomOf(seed), out = [{ x: 0, y: 0, w: size, h: size }]; let guard = 0;
  while (out.length < target && guard++ < 1000) {
    const possible = out.filter(v => v.w > 1 || v.h > 1); if (!possible.length) break;
    const q = possible[Math.floor(r() * possible.length)], i = out.indexOf(q);
    let vertical = q.w > q.h ? true : q.h > q.w ? false : r() > .5;
    if (vertical && q.w < 2) vertical = false; if (!vertical && q.h < 2) vertical = true;
    if (vertical) { const cut = 1 + Math.floor(r() * (q.w - 1)); out.splice(i, 1, { x: q.x, y: q.y, w: cut, h: q.h }, { x: q.x + cut, y: q.y, w: q.w - cut, h: q.h }); }
    else { const cut = 1 + Math.floor(r() * (q.h - 1)); out.splice(i, 1, { x: q.x, y: q.y, w: q.w, h: cut }, { x: q.x, y: q.y + cut, w: q.w, h: q.h - cut }); }
  }
  return out;
}
function timeText(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

const store = {
  get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
};

// Poki is optional while testing on GitHub Pages. The game stays fully playable there:
// if the SDK is missing or init() fails, ads fall back to a short local test break.
const poki = {
  ready: false,
  available() { return typeof window !== 'undefined' && !!window.PokiSDK; },
  safe(fn) { try { return fn(); } catch (e) { return undefined; } },
  init() {
    if (!this.available()) { this.ready = false; return Promise.resolve(false); }
    try {
      return window.PokiSDK.init()
        .then(() => { this.ready = true; return true; })
        .catch(() => { this.ready = false; return false; });
    } catch (e) { this.ready = false; return Promise.resolve(false); }
  },
  loadingFinished() { if (this.ready) this.safe(() => window.PokiSDK.gameLoadingFinished()); },
  gameplayStart() { if (this.ready) this.safe(() => window.PokiSDK.gameplayStart()); },
  gameplayStop() { if (this.ready) this.safe(() => window.PokiSDK.gameplayStop()); },
  rewarded() {
    if (!this.ready || !window.PokiSDK.rewardedBreak) return Promise.resolve(false);
    try { return window.PokiSDK.rewardedBreak(); } catch (e) { return Promise.resolve(false); }
  }
};

function App() {
  const [level, setLevel] = useState(1);
  const [layout, setLayout] = useState(0);
  const [drafts, setDrafts] = useState([]);
  const [solved, setSolved] = useState([]);
  const [selection, setSelection] = useState(null);
  const [hint, setHint] = useState(null);
  const [seconds, setSeconds] = useState(0);
  const [moves, setMoves] = useState(0);
  const [complete, setComplete] = useState(false);
  const [settings, setSettings] = useState(false);
  const [music, setMusic] = useState(true);
  const [effects, setEffects] = useState(true);
  const [ad, setAd] = useState(false);
  const [adAction, setAdAction] = useState(null);
  const [toast, setToast] = useState(null);
  const [themePulse, setThemePulse] = useState(false);
  const [language, setLanguage] = useState('tr');
  const [languagePrompt, setLanguagePrompt] = useState(false);
  const [tutorialVisible, setTutorialVisible] = useState(true);
  const [tutorialStep, setTutorialStep] = useState(0);
  const [hintVisible, setHintVisible] = useState(false);
  const [adTimer, setAdTimer] = useState(null);

  const text = LANGUAGES[language] || LANGUAGES.tr;
  const hideWrong = level > 20;
  const board = useRef(null), audio = useRef(null), dragRef = useRef(false);

  const notify = message => {
    setToast(message);
    window.clearTimeout(notify.timer);
    notify.timer = window.setTimeout(() => setToast(null), 3200);
  };

  useEffect(() => {
    const saved = store.get('shikaku-language');
    if (saved && LANGUAGES[saved]) setLanguage(saved);
    else setLanguagePrompt(true);

    let active = true;
    poki.init().then(() => {
      if (!active) return;
      poki.loadingFinished();
      poki.gameplayStart();
    });
    return () => { active = false; poki.gameplayStop(); };
  }, []);

  // Native, non-passive touchmove listener attached to the board element only.
  // A drag that starts on the board never scrolls the page; touches that start
  // anywhere else never reach this listener, so the page scrolls normally.
  // Works even if the Tailwind CDN fails to load.
  useEffect(() => {
    const el = board.current;
    if (!el) return;
    const blockScroll = e => { e.preventDefault(); };
    el.addEventListener('touchmove', blockScroll, { passive: false });
    return () => el.removeEventListener('touchmove', blockScroll);
  }, []);

  const applyLanguage = code => {
    setLanguage(code);
    store.set('shikaku-language', code);
    setLanguagePrompt(false);
  };

  const activeReward = rewardForLevel(level);
  const themeNumber = VISUAL_REWARDS.indexOf(activeReward) + 1;
  const themeName = (text.themes || [])[themeNumber - 1] || activeReward.name;

  const cfg = levelConfig(level), seed = 'shikaku-' + level + '-' + layout;
  const regions = useMemo(() => makeRegions(seed, cfg.size, cfg.target), [seed, cfg.size, cfg.target]);
  const numbers = useMemo(() => {
    const m = {};
    regions.forEach((r, i) => {
      const x = r.x + Math.floor((r.w - 1) / 2), y = r.y + Math.floor((r.h - 1) / 2);
      m[x + ':' + y] = { value: r.w * r.h, color: COLORS[i % COLORS.length] };
    });
    return m;
  }, [regions]);

  const tone = (f, d, type, force) => {
    if (!effects && !force) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!audio.current) audio.current = new AC();
      const c = audio.current;
      if (c.state === 'suspended') c.resume();
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, c.currentTime);
      g.gain.exponentialRampToValueAtTime(.045, c.currentTime + .015);
      g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + (d || .1));
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime + (d || .1) + .03);
    } catch (e) {}
  };

  useEffect(() => {
    if (complete) return;
    const t = setInterval(() => setSeconds(v => v + 1), 1000);
    return () => clearInterval(t);
  }, [complete, seed]);

  useEffect(() => {
    if (complete) poki.gameplayStop();
  }, [complete]);

  useEffect(() => {
    setDrafts([]); setSolved([]); setSelection(null); setHint(null); setHintVisible(false); setSeconds(0); setMoves(0); setComplete(false);
    setTutorialVisible(level <= 3);
    setTutorialStep(0);
  }, [seed]);

  useEffect(() => {
    if (!tutorialVisible || level > 3) return;
    const timer = window.setInterval(() => setTutorialStep(v => (v + 1) % 3), 2000);
    return () => window.clearInterval(timer);
  }, [tutorialVisible, level]);

  useEffect(() => {
    if (!music) return;
    const notes = [261.63, 329.63, 392, 523.25, 392, 329.63]; let step = 0;
    const t = setInterval(() => { if (!ad) tone(notes[step++ % notes.length], .3, 'sine', true); }, 720);
    return () => clearInterval(t);
  }, [music, ad]);

  useEffect(() => {
    if (level === 20) {
      const t = window.setTimeout(() => notify(text.hardMode), 3600);
      return () => window.clearTimeout(t);
    }
  }, [level, language]);

  const cellAt = e => {
    const p = e.touches && e.touches[0] ? e.touches[0] : e, r = board.current.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(cfg.size - 1, Math.floor((p.clientX - r.left) / (r.width / cfg.size)))),
      y: Math.max(0, Math.min(cfg.size - 1, Math.floor((p.clientY - r.top) / (r.height / cfg.size))))
    };
  };
  const normalized = (a, b) => ({ x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x) + 1, h: Math.abs(a.y - b.y) + 1 });
  const contains = (r, x, y) => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h;
  const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  const touchesNumber = shape => {
    for (let x = shape.x; x < shape.x + shape.w; x++)
      for (let y = shape.y; y < shape.y + shape.h; y++)
        if (numbers[x + ':' + y]) return true;
    return false;
  };

  const start = e => {
    if (complete) return;
    dragRef.current = false;
    const c = cellAt(e); setHint(null); setHintVisible(false); setTutorialVisible(false);
    setSelection({ x1: c.x, y1: c.y, x2: c.x, y2: c.y });
  };
  const drag = e => {
    if (!selection || complete) return;
    dragRef.current = true;
    const c = cellAt(e);
    setSelection(v => v ? { x1: Math.min(v.x1, c.x), y1: Math.min(v.y1, c.y), x2: Math.max(v.x2, c.x), y2: Math.max(v.y2, c.y) } : v);
  };
  const finish = () => {
    if (!selection || complete) return;
    const shape = normalized({ x: selection.x1, y: selection.y1 }, { x: selection.x2, y: selection.y2 });
    setSelection(null);
    if (!dragRef.current) {
      const oneCellIndex = regions.findIndex((r, i) => !solved.includes(i) && r.x === shape.x && r.y === shape.y && r.w === 1 && r.h === 1);
      if (oneCellIndex >= 0) {
        setMoves(v => v + 1);
        setDrafts(v => v.filter(d => !contains(d, shape.x, shape.y)));
        setSolved(v => v.concat(oneCellIndex));
        tone(660, .1); tone(880, .14);
        if (solved.length + 1 === regions.length) { setComplete(true); tone(1046, .24); }
        return;
      }
      const draftIndex = drafts.findIndex(d => contains(d, shape.x, shape.y));
      if (draftIndex >= 0) { setMoves(v => v + 1); setDrafts(v => v.filter((_, i) => i !== draftIndex)); tone(660, .1); tone(880, .14); }
      return;
    }
    if (!touchesNumber(shape)) return;
    const isSolved = regions.some((r, i) => !solved.includes(i) && r.x === shape.x && r.y === shape.y && r.w === shape.w && r.h === shape.h);
    setDrafts(v => v.filter(d => !overlaps(d, shape)));
    setMoves(v => v + 1);
    if (isSolved) {
      const i = regions.findIndex(r => r.x === shape.x && r.y === shape.y && r.w === shape.w && r.h === shape.h);
      setSolved(v => v.includes(i) ? v : v.concat(i));
      tone(660, .1); tone(880, .14);
      if (solved.length + 1 === regions.length) { setComplete(true); tone(1046, .24); }
    } else {
      setDrafts(v => v.concat([{ ...shape, id: Date.now() }]));
      tone(660, .1); tone(880, .14);
    }
  };

  const resetBoard = () => {
    setDrafts([]); setSolved([]); setSelection(null); setHint(null); setSeconds(0); setMoves(0); setComplete(false);
  };

  const advanceLevel = () => {
    const next = level + 1;
    const unlocked = VISUAL_REWARDS.find(r => r.unlock === next);
    if (unlocked) {
      const idx = VISUAL_REWARDS.indexOf(unlocked) + 1;
      notify(text.themeNew + ((text.themes || [])[idx - 1] || unlocked.name));
      setThemePulse(true);
      window.setTimeout(() => setThemePulse(false), 1600);
    }
    setLevel(next);
    setLayout(0);
  };

  const finishAd = action => {
    setAd(false);
    if (action === 'layout') {
      setHint(null); setHintVisible(false); setLayout(v => v + 1);
    }
    if (action === 'hint') {
      const i = regions.findIndex((r, n) => !solved.includes(n));
      if (i >= 0) { setHint(i); setHintVisible(true); setTutorialVisible(false); tone(720, .14); notify(text.hintUsed); }
    }
    setAdAction(null); setAdTimer(null);
    poki.gameplayStart();
  };
  const watchAdFor = action => {
    if (complete && action === 'layout') return;
    if (adTimer) window.clearTimeout(adTimer);
    setAdAction(action); setAd(true); poki.gameplayStop();

    // No working Poki SDK (e.g. GitHub Pages): short local test break instead.
    if (!poki.ready) {
      setAdTimer(window.setTimeout(() => finishAd(action), 1800));
      return;
    }

    // Real rewarded ad. The safety timer guarantees the overlay always closes,
    // even if the SDK promise never settles.
    let settled = false;
    const safety = window.setTimeout(() => {
      if (settled) return;
      settled = true;
      finishAd(action);
    }, 15000);
    poki.rewarded().then(success => {
      if (settled) return;
      settled = true;
      window.clearTimeout(safety);
      if (success) finishAd(action);
      else { setAd(false); setAdAction(null); setAdTimer(null); poki.gameplayStart(); }
    }).catch(() => {
      if (settled) return;
      settled = true;
      window.clearTimeout(safety);
      setAd(false); setAdAction(null); setAdTimer(null); poki.gameplayStart();
    });
  };
  const giveHint = () => watchAdFor('hint');

  const rect = r => ({ left: r.x * 100 / cfg.size + '%', top: r.y * 100 / cfg.size + '%', width: r.w * 100 / cfg.size + '%', height: r.h * 100 / cfg.size + '%' });
  const picked = selection ? normalized({ x: selection.x1, y: selection.y1 }, { x: selection.x2, y: selection.y2 }) : null;
  const cells = Array.from({ length: cfg.size * cfg.size }, (_, i) => ({ x: i % cfg.size, y: Math.floor(i / cfg.size) }));
  let filled = 0; solved.forEach(i => { filled += regions[i].w * regions[i].h; });
  const nextTheme = themeNumber < VISUAL_REWARDS.length ? VISUAL_REWARDS[themeNumber] : null;
  const tutorialRegion = regions[0] || { x: 0, y: 0, w: 1, h: 1 };
  const tutorialNumberCell = { x: tutorialRegion.x + Math.floor((tutorialRegion.w - 1) / 2), y: tutorialRegion.y + Math.floor((tutorialRegion.h - 1) / 2) };
  const hintRegion = hint !== null ? regions[hint] : null;
  const hintNumberCell = hintRegion ? { x: hintRegion.x + Math.floor((hintRegion.w - 1) / 2), y: hintRegion.y + Math.floor((hintRegion.h - 1) / 2) } : null;
  const hardModeMessage = hideWrong ? text.hardMode : null;
  const bg = activeReward.board + ' text-slate-900', panel = 'bg-white border-slate-300 text-slate-900', muted = 'text-slate-600', line = 'border-slate-300';

  return (
    <main className={'min-h-screen font-grotesk ' + bg}>
      <style>{CSS}</style>

      {toast ? <div className="game-toast fixed left-1/2 top-4 z-50 w-11/12 max-w-md -translate-x-1/2 border border-emerald-700 bg-white px-4 py-3 text-center text-sm font-bold text-emerald-900" role="status">{toast}</div> : null}

      {themePulse ? (
        <div className="pointer-events-none fixed inset-0 z-40 overflow-hidden">
          {Array.from({ length: 18 }, (_, i) => (
            <span key={i} className="theme-particle absolute h-2 w-2 rounded-full" style={{ left: (8 + (i * 37) % 84) + '%', top: (12 + (i * 23) % 72) + '%', backgroundColor: activeReward.accent, animationDelay: (i % 6) * .06 + 's' }}></span>
          ))}
          <div className="absolute left-1/2 top-1/3 -translate-x-1/2 border border-slate-300 bg-white px-6 py-4 text-center text-slate-900">
            <div className="text-xs font-bold uppercase tracking-widest text-slate-500">{text.themeTitle}</div>
            <div className="mt-1 text-xl font-bold" style={{ color: activeReward.accent }}>{themeName}</div>
          </div>
        </div>
      ) : null}

      <header className={'border-b ' + line + ' ' + panel}>
        <div className="mx-auto flex max-w-6xl items-center justify-between gap-4 px-5 py-5">
          <div>
            <div className={'text-xs font-bold uppercase tracking-widest ' + muted}>Grid Lab</div>
            <h1 className="mt-1 text-3xl font-bold tracking-tight">SHIKAKU</h1>
          </div>
          <div className="flex items-center gap-4">
            <div className="text-right">
              <div className={'text-xs uppercase tracking-widest ' + muted}>{text.level}</div>
              <div className="text-2xl font-bold tabular-nums text-indigo-700">{level}</div>
            </div>
            <button onClick={() => setSettings(true)} className={'flex items-center justify-center border px-3 py-2 text-slate-700 ' + line} aria-label={text.settings}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="3" y1="6" x2="21" y2="6" /><circle cx="9" cy="6" r="2.4" fill="white" /><line x1="3" y1="12" x2="21" y2="12" /><circle cx="15" cy="12" r="2.4" fill="white" /><line x1="3" y1="18" x2="21" y2="18" /><circle cx="7" cy="18" r="2.4" fill="white" /></svg>
            </button>
          </div>
        </div>
      </header>

      <section className="mx-auto grid max-w-6xl gap-8 px-5 py-8 lg:grid-cols-[1fr_300px]">
        <div>
          <div className={'flex flex-wrap gap-x-6 gap-y-2 border-b pb-4 text-xs font-bold uppercase tracking-widest ' + line + ' ' + muted}>
            <span>{text.board} {cfg.size}×{cfg.size}</span>
            <span>{text.regions} {regions.length}</span>
            <span>{text.time} <b className="text-base tabular-nums text-slate-900">{timeText(seconds)}</b></span>
            <span>{text.moves} <b className="text-base tabular-nums text-slate-900">{moves}</b></span>
          </div>
          <h2 className="mt-6 text-3xl font-bold tracking-tight text-slate-900">{text.title}</h2>
          <p className={'mt-4 border-y py-4 text-sm leading-6 ' + line + ' ' + muted}>{text.hint}</p>
          {hardModeMessage ? (
            <div className="mt-4 border-2 border-orange-400 bg-orange-50 px-4 py-3 text-center text-sm font-bold leading-6 text-orange-900" role="status">
              {hardModeMessage}
            </div>
          ) : null}

          <div className="mt-4 flex items-center gap-3">
            <div className="h-2 flex-1 bg-slate-200">
              <div className="h-full bg-indigo-600 transition-all" style={{ width: (solved.length / regions.length) * 100 + '%' }}></div>
            </div>
            <span className={'text-xs font-bold tabular-nums ' + muted}>{solved.length}/{regions.length}</span>
          </div>

          {tutorialVisible && level <= 3 ? (
            <div className="mx-auto mt-5 mb-4 max-w-md border-2 border-orange-400 bg-orange-50 px-5 py-4 text-center">
              <div className="text-xs font-bold uppercase tracking-widest text-orange-600">{text.how}</div>
              <div className="mt-1 text-base font-bold text-orange-900">{(text.tut || [])[tutorialStep] || ''}</div>
              <div className="mt-2 flex items-center justify-center gap-1.5">
                {[0, 1, 2].map(s => <span key={s} className={'h-2 w-8 ' + (s === tutorialStep ? 'bg-orange-600' : 'bg-orange-200')}></span>)}
              </div>
            </div>
          ) : null}

          <div className="mt-8 flex justify-center">
            <div
              ref={board}
              className={'relative grid touch-none select-none border border-slate-500 ' + activeReward.board}
              style={{ gridTemplateColumns: 'repeat(' + cfg.size + ',1fr)', gridTemplateRows: 'repeat(' + cfg.size + ',1fr)', width: 'min(92vw,560px)', aspectRatio: '1/1' }}
              onMouseDown={start} onMouseMove={drag} onMouseUp={finish} onMouseLeave={finish}
              onTouchStart={start} onTouchMove={drag} onTouchEnd={finish}
            >
              {cells.map((c, i) => (
                <div key={i} className="flex items-center justify-center border-b border-r border-slate-300">
                  {numbers[c.x + ':' + c.y]
                    ? <span className="z-10 text-xl font-bold sm:text-2xl" style={{ color: numbers[c.x + ':' + c.y].color.text }}>{numbers[c.x + ':' + c.y].value}</span>
                    : null}
                </div>
              ))}
              {(hideWrong ? [] : drafts).map(d => (
                <div key={d.id} className="pointer-events-none absolute z-10 border-2 border-slate-500 bg-slate-300/35" style={rect(d)}></div>
              ))}
              {regions.map((r, i) => solved.includes(i) ? (
                <div key={'s' + i} className="solved-region pointer-events-none absolute z-20 border-2" style={Object.assign({}, rect(r), { borderColor: COLORS[i % COLORS.length].line, backgroundColor: COLORS[i % COLORS.length].fill + 'b3' })}></div>
              ) : null)}
              {hintRegion ? (
                <div className="pointer-events-none absolute inset-0 z-30">
                  <div className="tutorial-draw absolute border-4 border-dashed border-orange-600 bg-orange-300/25" style={rect(hintRegion)}></div>
                  <div className="tutorial-tap absolute flex items-center justify-center" style={rect({ x: hintNumberCell.x, y: hintNumberCell.y, w: 1, h: 1 })}>
                    <span className="h-3/5 w-3/5 rounded-full border-4 border-orange-600 bg-orange-400/30"></span>
                  </div>
                </div>
              ) : null}
              {picked ? <div className="pointer-events-none absolute z-40 border-2 border-indigo-700 bg-indigo-300/40" style={rect(picked)}></div> : null}
              {tutorialVisible && hint === null ? (
                <div className="pointer-events-none absolute inset-0 z-30">
                  {tutorialStep === 0 ? (
                    <div key="tut-tap" className="tutorial-tap absolute flex items-center justify-center" style={rect({ x: tutorialNumberCell.x, y: tutorialNumberCell.y, w: 1, h: 1 })}>
                    <span className="h-3/5 w-3/5 rounded-full border-4 border-orange-600 bg-orange-400/30"></span>
                    </div>
                  ) : (
                    <div key={'tut-draw-' + tutorialStep} className="tutorial-draw absolute border-4 border-dashed border-orange-600 bg-orange-300/25" style={rect(tutorialRegion)}></div>
                  )}
                </div>
              ) : null}
            </div>
          </div>

          <div className="mt-6 flex flex-wrap justify-center gap-3">
            <button onClick={resetBoard} className={'border px-5 py-3 text-sm font-bold uppercase tracking-widest ' + line}>{text.reset}</button>
            <button onClick={() => watchAdFor('layout')} className={'border px-5 py-3 text-sm font-bold uppercase tracking-widest ' + line}>{text.layout}</button>
            <button onClick={giveHint} disabled={complete} className="bg-orange-700 px-5 py-3 text-sm font-bold uppercase tracking-widest text-white disabled:bg-slate-400">{text.hintButton}</button>
            {complete ? <button onClick={advanceLevel} className="bg-indigo-700 px-5 py-3 text-sm font-bold uppercase tracking-widest text-white">{text.next}</button> : null}
          </div>
        </div>

        <aside className={'border-t pt-6 lg:border-l lg:border-t-0 lg:pl-7 ' + line}>
          <div className={'text-xs font-bold uppercase tracking-widest ' + muted}>{text.status}</div>
          <div className={'mt-4 grid grid-cols-3 divide-x border-y text-center ' + line}>
            <div className="py-3"><div className={'text-xs ' + muted}>{text.cells}</div><div className="text-xl font-bold tabular-nums">{filled}/{cfg.size * cfg.size}</div></div>
            <div className="py-3"><div className={'text-xs ' + muted}>{text.drawings}</div><div className="text-xl font-bold tabular-nums">{drafts.length}</div></div>
            <div className="py-3"><div className={'text-xs ' + muted}>{text.level}</div><div className="text-xl font-bold tabular-nums">{level}</div></div>
          </div>
          <div className={'mt-7 text-xs font-bold uppercase tracking-widest ' + muted}>{text.how}</div>
          <ol className={'mt-3 divide-y border-y text-sm leading-6 ' + line}>
            <li className="py-3"><b className="mr-2 text-indigo-600">01</b>{text.step1}</li>
            <li className="py-3"><b className="mr-2 text-indigo-600">02</b>{text.step2}</li>
            <li className="py-3"><b className="mr-2 text-indigo-600">03</b>{text.step3}</li>
          </ol>
        </aside>
      </section>

      <footer className={'border-t px-5 py-5 text-center text-xs uppercase tracking-widest ' + line + ' ' + muted}>Shikaku · {text.level} {level}</footer>

      {ad ? (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 px-5">
          <div className="w-full max-w-sm border border-slate-600 bg-slate-900 p-8 text-center text-white">
            <div className="text-xs font-bold uppercase tracking-widest text-slate-300">{text.ad}</div>
            <div className="mt-5 text-5xl font-bold">•••</div>
            <div className="mt-5 text-sm text-slate-300">{text.adRunning}</div>
          </div>
        </div>
      ) : null}

      {settings ? (
        <div className="fixed inset-0 z-40 flex items-start justify-end bg-slate-950/40" onClick={() => setSettings(false)}>
          <div className={'h-full w-full max-w-sm overflow-y-auto border-l p-6 ' + panel + ' ' + line} onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between border-b pb-5">
              <h2 className="text-xl font-bold">{text.settings}</h2>
              <button onClick={() => setSettings(false)} className="flex items-center justify-center text-slate-700" aria-label={text.settings}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="5" y1="5" x2="19" y2="19" /><line x1="19" y1="5" x2="5" y2="19" /></svg>
              </button>
            </div>
            <div className="divide-y">
              <div className="flex items-center justify-between py-5 text-sm font-bold">
                {text.music}
                <span className="inline-flex border divide-x">
                  <button onClick={() => setMusic(true)} className={'px-3 py-2 text-xs font-bold ' + (music ? 'bg-indigo-700 text-white' : 'text-slate-700')}>{text.open}</button>
                  <button onClick={() => setMusic(false)} className={'px-3 py-2 text-xs font-bold ' + (!music ? 'bg-indigo-700 text-white' : 'text-slate-700')}>{text.closed}</button>
                </span>
              </div>
              <div className="flex items-center justify-between py-5 text-sm font-bold">
                {text.effects}
                <span className="inline-flex border divide-x">
                  <button onClick={() => setEffects(true)} className={'px-3 py-2 text-xs font-bold ' + (effects ? 'bg-indigo-700 text-white' : 'text-slate-700')}>{text.open}</button>
                  <button onClick={() => setEffects(false)} className={'px-3 py-2 text-xs font-bold ' + (!effects ? 'bg-indigo-700 text-white' : 'text-slate-700')}>{text.closed}</button>
                </span>
              </div>
              <div className="py-5">
                <div className="text-sm font-bold">{text.language}</div>
                <div className="mt-3 inline-flex w-full border divide-x">
                  {Object.keys(LANGUAGES).map(code => (
                    <button key={code} onClick={() => applyLanguage(code)} className={'flex-1 px-2 py-2 text-xs font-bold ' + (language === code ? 'bg-indigo-700 text-white' : 'text-slate-700')}>{LANGUAGES[code].name}</button>
                  ))}
                </div>
              </div>
              <div className="py-5">
                <div className="text-sm font-bold">{text.theme}</div>
                <p className={'mt-1 text-xs leading-5 ' + muted}>{text.themeAuto}</p>
                <div className="mt-3 border p-3 text-xs" style={{ borderColor: activeReward.accent }}>
                  <b style={{ color: activeReward.accent }}>{text.theme} {themeNumber}: {themeName}</b>
                  <span className={'mt-1 block ' + muted}>{nextTheme ? text.themeNext + ' ' + nextTheme.unlock : text.themeLast}</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      ) : null}

      {languagePrompt ? (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/95 px-5">
          <div className="w-full max-w-sm border border-slate-500 bg-white p-8 text-center text-slate-900">
            <div className="text-xs font-bold uppercase tracking-widest text-slate-500">Grid Lab</div>
            <h2 className="mt-3 text-3xl font-bold tracking-tight">SHIKAKU</h2>
            <p className="mt-4 text-sm text-slate-600">{LANGUAGES.tr.choose}</p>
            <div className="mt-6 divide-y border-t border-b text-left">
              {Object.keys(LANGUAGES).map(code => (
                <button key={code} onClick={() => applyLanguage(code)} className="flex w-full items-center justify-between py-4 text-sm font-bold text-slate-900 hover:bg-slate-100">
                  <span>{LANGUAGES[code].name}</span>
                  <span className="text-xs uppercase tracking-widest text-slate-500">{code}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      ) : null}
    </main>
  );
}
            ReactDOM.render(<App />, document.getElementById('artifact_react'));
        } catch(error) {
            displayError('An error occurred while loading the application.');
        }
        window.addEventListener('error', function(event) {
            displayError(event.message, event.error?.stack);
        });
        function displayError(message, stackInfo) {
            const errorContainer = document.getElementById('error-container');
            const errorMessage = document.createElement('div');
            errorMessage.textContent = message;
            errorContainer.appendChild(errorMessage);
            if(stackInfo) {
                const stackErrorMessage = document.createElement('pre');
                stackErrorMessage.textContent = stackInfo.substring(0, 130);
                errorContainer.appendChild(stackErrorMessage);
            }
            errorContainer.style.display = 'block';
        }
    </script>
</body>
</html>
